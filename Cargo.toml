[package]
name = "leetr"
version = "0.1.0"
edition = "2021"
# The MSRV is what the dependency graph demands, not a preference: the
# gpui-pre stack needs edition 2024 (1.85), tree-sitter-language asks for 1.90,
# and gpui-pre-linux pulls oo7 (secret-service), which asks for 1.92. CI builds
# with exactly this toolchain, so a stale value fails there rather than here.
rust-version = "1.92"
description = "A lightweight GPUI LeetCode client with first-class nvim interoperability"
license = "MIT"
repository = "https://github.com/HimanshuSardana/leetr"
readme = "README.md"
keywords = ["leetcode", "gpui", "nvim", "cli"]
categories = ["gui", "command-line-utilities"]

[dependencies]
# Syntax highlighting in the solution editor comes from tree-sitter grammars,
# which are compiled C and cost real binary size (~2 MB each), so only Python
# and C++ are compiled in. Every other LeetCode language renders as plain text
# — see `editor_language` in src/app.rs to change the set.
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter-cpp",
    "tree-sitter-python",
] }
# `futures` is only for the image `HttpClient` bridge (a oneshot channel and a
# boxed future); the app itself still runs no async runtime.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
anyhow = "1"
dirs = "6"
tiny_http = "0.12"
html-escape = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]

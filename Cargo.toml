[package]
name = "leetr"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A lightweight egui LeetCode client with first-class nvim interoperability"
license = "MIT"
repository = "https://github.com/HimanshuSardana/leetr"
readme = "README.md"
keywords = ["leetcode", "egui", "nvim", "cli"]
categories = ["gui", "command-line-utilities"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
anyhow = "1"
dirs = "6"
tiny_http = "0.12"
html-escape = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
